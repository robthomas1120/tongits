<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tongits Premium</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div id="game-container">
        <!-- Ambient Background Effects -->
        <div class="ambient-glow"></div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="glass-panel">
            <div class="lobby-header">
                <div class="logo-mark">T</div>
                <h1>Tongits</h1>
                <span class="premium-badge">Premium</span>
            </div>

            <div id="join-section">
                <div class="input-wrapper">
                    <input type="text" id="player-name" placeholder="Enter your name" autocomplete="off">
                </div>
                <button id="join-btn">
                    <span>Join Lobby</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </div>

            <div id="status-section" class="hidden">
                <div class="lobby-info">
                    <div class="section-header">
                        <span class="section-icon">●</span>
                        <h3>Players in Lobby</h3>
                    </div>
                    <div id="player-list"></div>
                </div>

                <div id="host-controls">
                    <div class="control-row">
                        <select id="bot-difficulty">
                            <option value="easy">Easy Bot</option>
                            <option value="medium" selected>Medium Bot</option>
                            <option value="hard">Hard Bot</option>
                        </select>
                        <button id="add-bot-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                            Add Bot
                        </button>
                    </div>
                    <button id="start-game-btn" class="primary-btn" disabled>
                        <span>Start Game</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Board (Table) -->
        <div id="game-screen" class="hidden">
            <!-- Global Controls at Top -->
            <div id="controls">
                <div class="controls-inner">
                    <button id="draw-stock-btn" class="ctrl-btn">
                        <span class="btn-label">Draw</span>
                    </button>
                    <button id="draw-discard-btn" class="ctrl-btn" disabled>
                        <span class="btn-label">Pick up</span>
                    </button>
                    <button id="discard-btn" class="ctrl-btn" disabled>
                        <span class="btn-label">Discard</span>
                    </button>
                    <div class="controls-divider"></div>
                    <div class="action-btns">
                        <button id="sort-btn" class="ctrl-btn">
                            <span class="btn-label">Sort</span>
                        </button>
                        <button id="fight-btn" class="ctrl-btn action-red" disabled>
                            <span class="btn-label">Fight</span>
                        </button>
                        <button id="group-btn" class="ctrl-btn">
                            <span class="btn-label">Group</span>
                        </button>
                        <button id="expose-btn" class="ctrl-btn" disabled>
                            <span class="btn-label">Expose</span>
                        </button>
                        <button id="suggest-btn" class="ctrl-btn ctrl-toggle active">
                            <span class="btn-label">Hints</span>
                        </button>
                        <button id="play-again-btn" class="ctrl-btn action-gold hidden">
                            <span class="btn-label">Again</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="table-area">
                <div class="table-felt">
                    <!-- Opponent 1 (Top-Left/Left) -->
                    <div id="player-left" class="player-slot opponent">
                        <div class="player-info-card">
                            <div class="avatar">
                                <span>👤</span>
                            </div>
                            <div class="details">
                                <span class="name">Waiting...</span>
                                <span class="chips">₱0</span>
                            </div>
                        </div>
                        <div class="exposed-melds-mini"></div>
                        <div class="hand-mini"></div>
                        <div class="exposed-melds"></div>
                    </div>

                    <!-- Opponent 2 (Top-Right/Right) -->
                    <div id="player-right" class="player-slot opponent">
                        <div class="player-info-card">
                            <div class="avatar">
                                <span>👤</span>
                            </div>
                            <div class="details">
                                <span class="name">Waiting...</span>
                                <span class="chips">₱0</span>
                            </div>
                        </div>
                        <div class="exposed-melds-mini"></div>
                        <div class="hand-mini"></div>
                        <div class="exposed-melds"></div>
                    </div>

                    <!-- Center Area -->
                    <div id="center-board">
                        <div class="pot-area">
                            <span class="pot-label">Pot</span>
                            <span id="side-pot-count">₱0</span>
                        </div>

                        <div class="piles-container">
                            <div class="pile-wrapper">
                                <div id="deck-pile" class="pile">
                                    <div class="card-back"></div>
                                    <span id="stock-count">0</span>
                                </div>
                                <span class="pile-label draw-label">DRAW</span>
                            </div>

                            <div class="pile-wrapper">
                                <div id="discard-pile" class="pile">
                                    <div class="empty-slot">DISCARD</div>
                                </div>
                                <span class="pile-label drop-label">DROP</span>
                            </div>
                        </div>

                        <div id="drop-area-main" class="drop-zone hidden">
                            <span>DROP AREA</span>
                        </div>
                    </div>

                    <!-- Player (Me - Bottom) -->
                    <div id="player-bottom" class="player-slot me">
                        <div id="my-exposed-melds" class="exposed-melds"></div>

                        <div class="hand-container">
                            <div id="expose-zone-left" class="expose-zone hidden"><span>EXPOSE</span></div>
                            <div id="my-hand" class="hand-area"></div>
                            <div id="expose-zone-right" class="expose-zone hidden"><span>EXPOSE</span></div>
                        </div>

                        <div class="player-info-footer">
                            <div class="player-info-card-compact">
                                <span id="my-name">Me</span>
                                <span id="my-chips">₱0</span>
                                <span id="my-score" class="points-badge">0 pts</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Game Log (Collapsible on mobile) -->
            <div id="game-log-container">
                <div id="game-log"></div>
            </div>
        </div>
    </div>

    <!-- Discard Pile History Modal -->
    <div id="discard-history-overlay" class="discard-history-overlay hidden">
        <div class="discard-history-modal">
            <div class="modal-header">
                <h3>Discard History</h3>
                <button id="close-history-btn" class="close-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-controls">
                <button id="sort-toggle-btn" class="sort-toggle-btn">
                    <span id="sort-mode-text">Chronological</span>
                    <span class="toggle-icon">⇄</span>
                </button>
            </div>
            <div id="discard-card-grid" class="discard-card-grid">
                <!-- Cards will be populated here -->
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>

</html>
